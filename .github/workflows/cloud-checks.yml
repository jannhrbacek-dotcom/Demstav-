name: Cloud deployment checks
on:
  push:
    branches: [main-2, 'deploy/**']
  pull_request:
    branches: [main-2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Backend cloud regressions
        run: |
          python3 -m venv /tmp/demstav-venv
          /tmp/demstav-venv/bin/pip install -r backend/requirements-cloud.txt httpx==0.28.1 pytest==8.4.2 pytest-asyncio==1.2.0 mongomock-motor==0.0.36
          /tmp/demstav-venv/bin/python -m pytest tests/test_cloud_deployment.py -q
      - name: Build production container
        run: docker build -t demstav-cloud-check .
      - name: Start with real MongoDB and verify persistence after restart
        run: |
          docker network create demstav-check
          docker run -d --name demstav-mongo-check --network demstav-check mongo:8.0
          docker run -d --name demstav-app-check --network demstav-check -p 127.0.0.1:10000:10000 \
            -e MONGO_URL=mongodb://demstav-mongo-check:27017 -e DB_NAME=demstav_ci \
            -e JWT_SECRET=isolated-ci-signing-secret-not-production \
            -e OWNER_EMAIL=owner@example.test -e OWNER_PASSWORD=IsolatedCIBootstrap123 \
            demstav-cloud-check
          /tmp/demstav-venv/bin/python tests/cloud_smoke.py
          docker restart demstav-app-check
          /tmp/demstav-venv/bin/python tests/cloud_smoke.py
      - name: Container diagnostics on failure
        if: failure()
        run: docker logs demstav-app-check 2>&1 | tail -80

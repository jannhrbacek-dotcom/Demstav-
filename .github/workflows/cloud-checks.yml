name: Cloud deployment checks
on:
  push:
    branches: [main-2, 'deploy/**']
  pull_request:
    branches: [main-2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Backend cloud regressions
        run: |
          python3 -m venv /tmp/demstav-venv
          /tmp/demstav-venv/bin/pip install -r backend/requirements-cloud.txt httpx==0.28.1 pytest==8.4.2 pytest-asyncio==1.2.0 mongomock-motor==0.0.36 pytest-xdist==3.8.0
          /tmp/demstav-venv/bin/python -m pytest tests/test_cloud_deployment.py tests/test_push_config.py tests/test_attendance_verification.py tests/test_operations_breaks.py tests/test_production_api.py tests/test_record_integrity.py -q
          node tests/sync_integrity.cjs
      - name: Build production container
        run: docker build -t demstav-cloud-check .
      - name: Start with real MongoDB and verify persistence after restart
        run: |
          docker network create demstav-check
          docker volume create demstav-mongo-data
          docker run -d --name demstav-mongo-seed --network demstav-check -v demstav-mongo-data:/data/db --entrypoint mongod mongo:7.0.45 --port 10000 --bind_ip_all --wiredTigerCacheSizeGB 0.25
          for attempt in $(seq 1 30); do
            if docker exec demstav-mongo-seed mongosh --quiet --port 10000 --eval 'db.getSiblingDB("ci_seed").sentinel.updateOne({_id:"keep"},{$set:{preserved:true}},{upsert:true})'; then break; fi
            sleep 1
          done
          docker stop demstav-mongo-seed
          docker run -d --name demstav-mongo-check --network demstav-check -v demstav-mongo-data:/data/db -e MONGO_INITDB_ROOT_USERNAME=demstavci -e MONGO_INITDB_ROOT_PASSWORD=IsolatedCIMongo456 --entrypoint /bin/bash mongo:7.0.45 -ec "$(cat deploy/mongo-start.sh)"
          docker run -d --name demstav-app-check --network demstav-check -p 127.0.0.1:10000:10000 \
            -e MONGO_URL=mongodb://demstavci:IsolatedCIMongo456@demstav-mongo-check:10000/?authSource=admin -e DB_NAME=demstav_ci \
            -e JWT_SECRET=isolated-ci-signing-secret-not-production \
            -e OWNER_EMAIL=owner@example.test -e OWNER_PASSWORD=IsolatedCIBootstrap123 \
            demstav-cloud-check
          /tmp/demstav-venv/bin/python tests/cloud_smoke.py
          docker exec demstav-mongo-check mongosh --norc --quiet --port 10000 --eval 'db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(!db.getSiblingDB("ci_seed").sentinel.findOne({_id:"keep",preserved:true}))throw new Error("Existing data was lost")'
          docker restart demstav-mongo-check
          docker restart demstav-app-check
          /tmp/demstav-venv/bin/python tests/cloud_smoke.py
      - name: Container diagnostics on failure
        if: failure()
        run: docker logs demstav-app-check 2>&1 | tail -80
